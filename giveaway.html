<!DOCTYPE html>
<html lang="uk">
<head>
  <link rel="icon" type="image/png" href="icons/icon-32.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giveaway · tyne.pro</title>
  <style>
    :root {
      --bg: #0f0e0d;
      --panel: #171614;
      --card: #1d1b18;
      --border: #34302b;
      --text: #f3eee6;
      --muted: #a9a299;
      --blue: #f0a33a;
      --green: #3ee6a8;
      --red: #ff7a6b;
      --yellow: #f0a33a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .wrap {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
      align-items: start;
    }
    label { display: block; margin: 0 0 6px; color: var(--muted); font-size: 12px; }
    input, textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: rgba(240,163,58,.75); }
    textarea { min-height: 86px; resize: vertical; }
    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      color: #1a1206;
      transition: opacity .15s, transform .15s;
      width: 100%;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: linear-gradient(90deg, var(--blue), #f2c46b); }
    .btn-green { background: var(--green); }
    .btn-sec { background: var(--card); border: 1px solid var(--border); }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-row button { flex: 1; }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: rgba(240,163,58,.12); color: #f6c98a; border: 1px solid rgba(240,163,58,.3); }
    .status.err  { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .status.ok   { background: rgba(16,185,129,.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
    .stats { display: none; margin-top: 16px; }
    .stats.show { display: block; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat .n { font-size: 24px; font-weight: 800; color: var(--yellow); }
    .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .toggle {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      margin-top: 12px;
    }
    .toggle .opt {
      flex: 1;
      background: transparent;
      color: var(--muted);
      padding: 8px;
      font-size: 12px;
      border-radius: 6px;
    }
    .toggle .opt.active { background: linear-gradient(90deg, var(--blue), #f2c46b); color: #1a1206; }
    .list {
      margin-top: 12px;
      max-height: 430px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 6px; font-size: 13px; }
    .row .u { color: var(--text); word-break: break-all; }
    .row .c { color: var(--muted); font-variant-numeric: tabular-nums; }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      vertical-align: 1px;
    }
    .badge.ok { color: #6ee7b7; background: rgba(16,185,129,.15); }
    .badge.bad { color: #fca5a5; background: rgba(239,68,68,.15); }
    .spin {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #1a1206;
      border-radius: 50%;
      animation: sp .7s linear infinite;
      vertical-align: middle;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (max-width: 760px) {
      .wrap { width: calc(100vw - 20px); padding: 14px 0; }
      header { display: block; }
      .grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 style="display:flex;align-items:center;gap:10px"><img src="icons/icon-48.png" width="28" height="28" alt="" style="border-radius:7px" />Giveaway · tyne.pro</h1>
        <p class="sub">Збір коментарів і перевірка підписок у стабільній вкладці</p>
      </div>
    </header>

    <div class="grid">
      <section class="panel">
        <label for="urlInput">Instagram post / reel URL</label>
        <input id="urlInput" type="url" placeholder="https://www.instagram.com/p/..." />
        <div class="btn-row">
          <button class="btn-primary" id="collect">Зібрати коментарі</button>
        </div>
        <div class="status" id="status"></div>

        <div class="stats" id="stats">
          <div class="stat-grid">
            <div class="stat"><div class="n" id="statTotal">0</div><div class="l">коментарів</div></div>
            <div class="stat"><div class="n" id="statUsers">0</div><div class="l">унікальних</div></div>
            <div class="stat"><div class="n" id="statEligible">—</div><div class="l">для колеса</div></div>
          </div>

          <div class="toggle" id="modeToggle">
            <button class="opt" data-mode="unique">Унікальні</button>
            <button class="opt active" data-mode="repeats">З повторами</button>
          </div>
          <button class="btn-primary" id="copy" style="margin-top: 10px;">Копіювати список</button>
          <div class="btn-row">
            <button class="btn-sec" id="json">Export JSON</button>
            <button class="btn-sec" id="csv">Export CSV</button>
          </div>
          <div class="list" id="list"></div>
        </div>
      </section>

      <aside class="panel">
        <label for="requiredPages">Сторінки, на які треба бути підписаним</label>
        <textarea id="requiredPages" placeholder="@brand&#10;@partner"></textarea>
        <button class="btn-green" id="checkSubs" style="margin-top: 10px;">Перевірити підписки</button>
      </aside>
    </div>
  </div>
  <script src="giveaway.js"></script>
</body>
</html>
