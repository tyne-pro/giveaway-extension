<!DOCTYPE html>
<html lang="uk">
<head>
  <link rel="icon" type="image/png" href="icons/icon-32.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0f0e0d;
      --card: #1d1b18;
      --border: #34302b;
      --text: #f3eee6;
      --muted: #a9a299;
      --blue: #f0a33a;
      --green: #3ee6a8;
      --red: #ff7a6b;
      --yellow: #f0a33a;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .wrap { padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 6px; }
    .sub { color: var(--muted); font-size: 11px; margin: 0 0 12px; }
    .url {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; font-size: 11px; color: var(--muted); word-break: break-all;
      margin-bottom: 10px; max-height: 44px; overflow: hidden;
    }
    button {
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      border: none; border-radius: 8px; padding: 9px 12px; color: #1a1206;
      transition: opacity .15s; width: 100%;
    }
    button:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: linear-gradient(90deg, var(--blue), #f2c46b); }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; }
    .btn-row button { flex: 1; padding: 8px; font-size: 12px; }
    .btn-sec { background: var(--card); border: 1px solid var(--border); }
    .toggle {
      display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 3px; margin-bottom: 8px;
    }
    .toggle .opt {
      flex: 1; background: transparent; color: var(--muted); padding: 7px;
      font-size: 12px; border-radius: 6px;
    }
    .toggle .opt.active { background: linear-gradient(90deg, var(--blue), #f2c46b); color: #1a1206; }
    .btn-green { background: var(--green); }
    .status {
      margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12px;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: rgba(240,163,58,.12); color: #f6c98a; border: 1px solid rgba(240,163,58,.3); }
    .status.err  { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .status.ok   { background: rgba(16,185,129,.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
    .stats { display: none; margin-top: 12px; }
    .stats.show { display: block; }
    .stat-grid { display: flex; gap: 8px; }
    .stat {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px; text-align: center;
    }
    .stat .n { font-size: 18px; font-weight: 700; color: var(--yellow); }
    .stat .l { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .field-label { display: block; margin: 10px 0 5px; color: var(--muted); font-size: 11px; }
    textarea {
      width: 100%; min-height: 58px; resize: vertical; font-family: inherit; font-size: 12px;
      color: var(--text); background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px; outline: none;
    }
    textarea:focus { border-color: rgba(240,163,58,.75); }
    .list {
      margin-top: 8px; max-height: 150px; overflow-y: auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px;
    }
    .row { display: flex; justify-content: space-between; padding: 3px 4px; font-size: 12px; }
    .row .u { color: var(--text); }
    .row .c { color: var(--muted); }
    .badge {
      display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 999px;
      font-size: 10px; font-weight: 700; vertical-align: 1px;
    }
    .badge.ok { color: #6ee7b7; background: rgba(16,185,129,.15); }
    .badge.bad { color: #fca5a5; background: rgba(239,68,68,.15); }
    .badge.warn { color: #fcd34d; background: rgba(245,158,11,.15); cursor: help; }
    .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: #1a1206; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: middle; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 style="display:flex;align-items:center;gap:10px"><img src="icons/icon-48.png" width="28" height="28" alt="" style="border-radius:7px" />Giveaway · tyne.pro</h1>
    <p class="sub">Збирає всі коментарі поста/reels без ліміту</p>

    <div class="url" id="url">Відкрийте пост Instagram у вкладці…</div>

    <button class="btn-primary" id="collect">Зібрати коментарі</button>
    <button class="btn-sec" id="stopCollect" style="display:none;margin-top:6px;width:100%;">Стоп (лишити зібране)</button>

    <div class="status" id="status"></div>

    <div class="stats" id="stats">
      <div class="stat-grid">
        <div class="stat"><div class="n" id="statTotal">0</div><div class="l">коментарів</div></div>
        <div class="stat"><div class="n" id="statUsers">0</div><div class="l">унікальних</div></div>
        <div class="stat"><div class="n" id="statEligible">—</div><div class="l">для колеса</div></div>
      </div>
      <label class="field-label" for="requiredPages">Сторінки, на які треба бути підписаним</label>
      <textarea id="requiredPages" placeholder="@brand&#10;@partner"></textarea>
      <div class="btn-row">
        <button class="btn-green" id="checkSubs">Перевірити підписки</button>
      </div>
      <div class="toggle" id="modeToggle">
        <button class="opt" data-mode="unique">Унікальні</button>
        <button class="opt active" data-mode="repeats">З повторами</button>
      </div>
      <div class="sub" id="copyPreview" style="margin:4px 0 0;"></div>
      <button class="btn-primary" id="copy">Копіювати список</button>
      <div class="btn-row">
        <button class="btn-sec" id="json">Export JSON</button>
        <button class="btn-sec" id="csv">Export CSV</button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
